name: check-availability

# 说明：GitHub Actions 位于海外出口，对国内站点会大面积误报 403/timeout。
# 权威检测已迁移到项目自己的 VPS（scripts/daily.sh + crontab，国内出口）。
# 本工作流仅保留手动触发，用于异地视角抽样，且只写观察数据、不改站点状态、不提交代码。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 异地视角抽样（observe-only，不改状态）
        run: node scripts/check.mjs --observe-only --concurrency 6 --timeout 12000
        continue-on-error: true

      - name: 输出站点清单摘要
        run: node scripts/build.mjs
